[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory"
version = "1.0.0"
description = "Warehouse inventory manager -- Part 1 milestone project"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
inv = "inventory.cli:run"          # this is what creates the `inv` command

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
